<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<main>
    <h1>Sign Up Form</h1>

    <fieldset>
        <legend>Sign Up</legend>

        <label>First Name:</label>
        <input type="text">
        <br>

        <label>Last Name:</label>
        <input type="text">
        <br>

        <label>Email:</label>
        <input type="text">
        <br>

        <label>Phone Number:</label>
        <input type="text">
        <br><br>

        <label>Zip Code:</label>
        <input id="zipCode" type="text">
        <span id="zipMessage"></span>
        <br>

        <label>City:</label>
        <span id="city"></span>
        <br>

        <label>Latitude:</label>
        <span id="latitude"></span>
        <br>

        <label>Longitude:</label>
        <span id="longitude"></span>
        <br><br>

        <label>State:</label>
        <select id="state">
            <option value="">Select a State</option>
        </select>
        <br>

        <label>Select a County:</label>
        <select id="county">
            <option value="">Select a County</option>
        </select>
        <br><br>

        <label>Desired Username:</label>
        <input id="username" type="text">
        <span id="usernameMessage"></span>
        <br>

        <label>Password:</label>
        <input id="password" type="password">
        <span id="passwordMessage"></span>
        <br>

        <label>Suggested Password:</label>
        <span id="suggestedPassword"></span>
        <br>

        <label>Type Password Again:</label>
        <input id="passwordAgain" type="password">
        <span id="passwordAgainMessage"></span>
        <br><br>

        <input id="submitButton" type="submit" value="Sign up!">
    </fieldset>
</main>

<script src="js/script.js"></script>
</body>
</html>
